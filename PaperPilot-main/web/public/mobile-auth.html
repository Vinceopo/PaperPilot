<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>PaperPilot · Google sign-in</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #eef1f5;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #0f1b2d;
      }
      main {
        max-width: 360px;
        padding: 32px 24px;
        text-align: center;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        font-size: 15px;
        color: #64748b;
        margin: 0 0 24px;
      }
      a {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 12px;
        background: #16bfa8;
        color: #0f1b2d;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Returning to PaperPilot…</h1>
      <p id="message">If the app does not open, tap the button below.</p>
      <a id="open" href="#" hidden>Open PaperPilot</a>
    </main>
    <script>
      (function () {
        // Only hand tokens to the PaperPilot app scheme or to Expo Go on a private LAN.
        var ALLOWED_RETURN = [
          /^paperpilot:\/\//,
          /^exps?:\/\/(localhost|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})(:\d+)?\//,
        ];

        var title = document.getElementById("title");
        var message = document.getElementById("message");
        var link = document.getElementById("open");

        var params = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
        history.replaceState(null, "", location.pathname);

        var returnUrl = "";
        try {
          var state = JSON.parse(params.get("state") || "{}");
          if (typeof state.returnUrl === "string") returnUrl = state.returnUrl;
        } catch (e) {
          returnUrl = "";
        }

        var allowed = ALLOWED_RETURN.some(function (re) {
          return re.test(returnUrl);
        });
        if (!allowed) {
          title.textContent = "Sign-in could not continue";
          message.textContent = "This sign-in link is not valid. Go back to the PaperPilot app and try again.";
          return;
        }

        var out = new URLSearchParams();
        var idToken = params.get("id_token");
        if (idToken) out.set("id_token", idToken);
        else out.set("error", params.get("error") || "missing_token");

        var target = returnUrl + (returnUrl.indexOf("?") === -1 ? "?" : "&") + out.toString();
        link.href = target;
        link.hidden = false;
        location.replace(target);
      })();
    </script>
  </body>
</html>
