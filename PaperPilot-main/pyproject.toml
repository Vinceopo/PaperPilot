[project]
name = "paperpilot"
version = "10.0.1"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "python-multipart==0.0.20",
  "google-generativeai==0.8.3",
  "pypdf==5.1.0",
  "python-dotenv==1.0.1",
  "firebase-admin==6.6.0",
  "python-docx==1.1.2",
  "PyMuPDF==1.25.1",
  "resend>=2.10.0",
  "httpx==0.28.1",
  "boto3>=1.35.0",
]

[tool.vercel]
entrypoint = "api.index:app"

[tool.vercel.scripts]
# Runs after Python deps install. Builds the Vite SPA into public/ for CDN.
build = "cd web && npm install && npm run build && rm -rf ../public && mkdir -p ../public && cp -a dist/. ../public/"
